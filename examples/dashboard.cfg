# ami2ha dashboard -- example
#
# Generate a starting point from your own instance instead of typing this:
#   ami2ha homeassistant.local TOKENFILE=S:ha.token WRITECONFIG=S:ami2ha.cfg
# then delete what you do not want.

host       homeassistant.local
port       8123

# Optional: reach the server over https instead. Needs AmiSSL 5, and the
# port then defaults to 443. Leave these out entirely for plain http.
#tls        yes
# Only for a self-signed certificate: still encrypted, but no longer proof
# of who is answering. Do not use it over the open internet.
#tlsverify  no
tokenfile  S:ha.token
columns    2

group "Wohnzimmer"
    sensor sensor.wohnzimmer_temperatur label "Temperatur"
    sensor sensor.wohnzimmer_luftfeuchte label "Feuchte"
    gauge  sensor.wohnzimmer_co2 label "CO2" min 400 max 2000
    toggle light.wohnzimmer label "Licht"
end

group "Küche"
    toggle light.kueche label "Licht"
    gauge  sensor.kueche_verbrauch label "Verbrauch" min 0 max 3000
end

group "Szenen"
    text   "Ein Klick genügt"
    button scene.turn_on  entity scene.gute_nacht label "Gute Nacht"
    button script.turn_on entity script.alles_aus label "Alles aus"
    button light.turn_on  entity light.kueche label "Küche hell" \
           data {"brightness":255}
end

# Right-clicking a camera tile offers "Save snapshot", which keeps the frame on
# screen. Unset, they go to PROGDIR:snapshots.
#
# savedir    Work:ami2ha-shots

# A camera entity becomes a tile showing a snapshot. Click it to fetch a
# new picture. Needs a JPEG datatype installed -- nothing else here does.
#
# width/height are what Home Assistant is asked for, and it scales on the
# server, so they decide the transfer and the decoding rather than just the
# size on screen. Both are needed: a width on its own is ignored.
#
#group "Hof"
#    camera camera.einfahrt label "Einfahrt" width 320 height 180
#    # refresh 300   -- seconds between automatic updates; without it, only
#    #                  when clicked
#    # timestamp no  -- drop the caption showing when the picture arrived
#end

# A media player becomes one row: what is playing, and buttons for previous,
# play/pause, next and volume. Everything shown comes from Home Assistant, so
# a radio stream with no artist simply shows its title and station.
#
# group "Musik"
#     media media_player.squeezebox label "Squeezer"
# end

# A dimmer puts a light's brightness on a slider, 0 to 100 percent. It reads
# "-" rather than "0%" while the lamp is off: an off lamp reports no
# brightness at all, and 0% would claim someone had dimmed it right down.
# Dragging sends one command when you let go, not one per pixel.
#
# group "Licht"
#     dimmer light.wohnzimmer label "Wohnzimmer"
# end

# A colour light gets red, green and blue with a preview. It stays greyed
# out until the light is on and reports a colour -- an off lamp has none to
# show, and a control that invented one would push it to the lamp as soon as
# the window opened.
#
# group "Farbe"
#     color light.strip label "LED Strip"
# end

# A cover is a blind, shutter or awning: Open, Stop and Close, with the
# position beside them when the cover reports one. Stop is the reason a
# cover is not a toggle -- it is what you reach for when the blind is going
# the wrong way, and a checkbox cannot offer it.
#
# group "Rollladen"
#     cover cover.kueche label "Kueche"
# end
