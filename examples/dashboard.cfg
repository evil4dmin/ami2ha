# ami2ha dashboard -- example
#
# Generate a starting point from your own instance instead of typing this:
#   ami2ha homeassistant.local TOKENFILE=S:ha.token WRITECONFIG=S:ami2ha.cfg
# then delete what you do not want.

host       homeassistant.local
port       8123
tokenfile  S:ha.token
columns    2

group "Wohnzimmer"
    sensor sensor.wohnzimmer_temperatur label "Temperatur"
    sensor sensor.wohnzimmer_luftfeuchte label "Feuchte"
    gauge  sensor.wohnzimmer_co2 label "CO2" min 400 max 2000
    toggle light.wohnzimmer label "Licht"
end

group "Küche"
    toggle light.kueche label "Licht"
    gauge  sensor.kueche_verbrauch label "Verbrauch" min 0 max 3000
end

group "Szenen"
    text   "Ein Klick genügt"
    button scene.turn_on  entity scene.gute_nacht label "Gute Nacht"
    button script.turn_on entity script.alles_aus label "Alles aus"
    button light.turn_on  entity light.kueche label "Küche hell" \
           data {"brightness":255}
end
